__BASECSS__
/* Demo 4 additions */
.scroll { position: relative; }
.intro-short { padding-bottom: 0; }
.field { margin: 0 0 var(--s4); }
.field > label, fieldset.field > legend { display: block; font-weight: 700; margin-bottom: var(--s1); font-size: 0.9375rem; }
.help { display: block; font-size: 0.875rem; color: var(--slate); margin-bottom: var(--s1); }
input[type="text"] { width: 100%; font: inherit; font-size: 1rem; min-height: 3rem; padding: var(--s2) var(--s3); border: 1.5px solid var(--slate); border-radius: var(--r-md); background: #fff; color: var(--ink); }

.rank-item { display: grid; grid-template-columns: 2rem 1fr; gap: var(--s1) var(--s3); padding: var(--s4); border: 1.5px solid var(--line); border-radius: var(--r-md); background: #fff; }
.rank-num { grid-row: span 3; display: inline-grid; place-items: center; width: 2rem; height: 2rem; border-radius: var(--r-pill); background: var(--ink); color: var(--paper); font-weight: 800; }
